name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CI pipeline
        run: node scripts/ci.mjs

      - name: Upload CI stage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-stages-report
          path: reports/ci-stages.json
          retention-days: 30

      - name: Upload self-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-audit-report
          path: reports/self-audit.json
          retention-days: 30
