# Supabase local development configuration
# https://supabase.com/docs/guides/local-development

project_id = "intrilex"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "http://localhost:3099", "http://127.0.0.1:3000", "http://127.0.0.1:4173"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.external.discord]
enabled = false
client_id = ""
secret = ""
redirect_uri = ""
url = "https://discord.com/api/oauth2/authorize"
skip_nonce_check = false
